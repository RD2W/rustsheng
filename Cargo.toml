[workspace]
resolver = "2"
members = ["crates/rustsheng-core", "crates/rustsheng"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
authors = ["RD2W <mkrutovercev@yandex.ru>"]

[workspace.dependencies]
thiserror = "2"
log = "0.4"
serialport = "4.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
env_logger = "0.11"
indicatif = "0.18"
aes = "0.8"
cbc = "0.1"
