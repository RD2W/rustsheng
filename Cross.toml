# Cross-compilation settings for `cross` (https://github.com/cross-rs/cross).
#
# The `serialport` crate links libudev on Linux, so the aarch64 build needs the
# arm64 libudev headers inside the cross container.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes libudev-dev:arm64 pkg-config",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS=1"]
